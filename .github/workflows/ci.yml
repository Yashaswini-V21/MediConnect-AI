name: CI

on:
  push:
    branches: [ main, master, feat/**, fix/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─────────────────────────────────────────────
  # 1. Backend syntax + import check
  # ─────────────────────────────────────────────
  python-check:
    name: Backend — syntax & imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend requirements (Linux-safe)
        run: |
          python -m pip install --upgrade pip
          # Exclude Windows-only packages (pywin32, pyttsx3 COM backend)
          grep -v -E "^pywin32|^pyttsx3" backend/requirements.txt | pip install -r /dev/stdin

      - name: Check Python syntax (compileall)
        run: python -m compileall backend -q

      - name: Run backend smoke test
        run: |
          cd backend
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          # Verify critical imports succeed
          from models.symptom_analyzer import get_symptom_analyzer
          from models.hospital_matcher import get_hospital_matcher
          from utils.ai_provider import RuleBasedProvider
          from utils.distance_calculator import calculate_distance
          print('Backend smoke test: OK')
          "

  # ─────────────────────────────────────────────
  # 2. Frontend build
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
        env:
          CI: false   # Treat ESLint warnings as warnings, not errors

      - name: Confirm build artifact exists
        run: test -f frontend/build/index.html

  # ─────────────────────────────────────────────
  # 3. Secret scan — only flag real-looking secrets
  # ─────────────────────────────────────────────
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for real secrets (not placeholders)
        run: |
          set +e
          # Only match real-looking secret values: base64 tokens, API key patterns
          # Excludes: placeholder strings like CHANGE_ME, your_key_here, etc.
          # Excludes: all .md files, .env.example, CI config itself
          RESULTS=$(git grep -nE \
            '(AIzaSy[A-Za-z0-9_-]{33}|gsk_[A-Za-z0-9]{50,}|sk-[A-Za-z0-9]{40,}|[A-Za-z0-9+]{44,}={0,2})' \
            -- \
            ':!*.md' \
            ':!*.example' \
            ':!*.env.example' \
            ':!.github/workflows/*' \
            ':!frontend/build/*' \
            ':!*package-lock.json' \
            ':!*package.json' \
            2>/dev/null || true)

          if [ -n "$RESULTS" ]; then
            echo "⚠️  Potential real secrets found:"
            echo "$RESULTS"
            exit 1
          else
            echo "✅ No real secrets detected"
          fi

  # ─────────────────────────────────────────────
  # 4. Docker build validation
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker — build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t mediconnect-backend:ci -f backend/Dockerfile .
