name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-check:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
      - name: Check Python syntax
        run: python -m compileall backend || true

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build --if-present

  secret-scan:
    name: Simple secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quick pattern scan for obvious secrets
        run: |
          set -e
          patterns="(AIza|GROQ|AWS|SECRET|TOKEN|TWILIO|SENDGRID|PRIVATE_KEY|ENCRYPTION_KEY|JWT)"
          # exclude common markdown and docs files
          if git grep -nE "$patterns" -- ':!*.md' || true; then
            echo "Potential secrets found (see output). If these are false positives, update .gitignore or .env.example."
            git grep -nE "$patterns" -- ':!*.md'
            exit 1
          else
            echo "No obvious secrets found by quick scan"
          fi
