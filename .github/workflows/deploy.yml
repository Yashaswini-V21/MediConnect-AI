name: MediConnect-AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ════════════════════════════════════════
  # TEST: Backend Python Tests
  # ════════════════════════════════════════
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run backend tests
        run: |
          cd backend
          pytest tests/ --cov=. --cov-report=xml --cov-report=html -v
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Health check endpoint verification
        run: |
          cd backend
          python -c "from app import app; print('✅ App imports successfully')"

  # ════════════════════════════════════════
  # TEST: Frontend Build & Tests
  # ════════════════════════════════════════
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          CI: true

      - name: Run frontend tests (if available)
        run: |
          cd frontend
          npm test -- --passWithNoTests --coverage=false
        continue-on-error: true

  # ════════════════════════════════════════
  # DEPLOY: Backend to Render
  # ════════════════════════════════════════
  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to Render
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}
          else
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEV }}
          fi
        continue-on-error: true

      - name: Notify deployment
        run: echo "✅ Backend deployment triggered to Render"

  # ════════════════════════════════════════
  # DEPLOY: Frontend to Vercel
  # ════════════════════════════════════════
  deploy-frontend:
    needs: test-frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend to Vercel
        uses: BetaHuhn/deploy-to-vercel-action@v1
        with:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Notify deployment
        run: echo "✅ Frontend deployment triggered to Vercel"

  # ════════════════════════════════════════
  # CODE QUALITY: Linting & Analysis
  # ════════════════════════════════════════
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check Python formatting with Black
        run: black --check backend/ --exclude="venv,__pycache__"
        continue-on-error: true

      - name: Run Flake8 linting
        run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run ESLint on frontend
        run: |
          cd frontend
          npm install eslint --save-dev 2>/dev/null || true
          npm run lint 2>/dev/null || echo "No lint script configured"
        continue-on-error: true

  # ════════════════════════════════════════
  # SECURITY: Dependency Scanning
  # ════════════════════════════════════════
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install safety tool
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Scan Python dependencies
        run: |
          pip install -r backend/requirements.txt
          safety check --json
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Audit npm packages
        run: |
          cd frontend
          npm audit --audit-level=moderate
        continue-on-error: true

  # ════════════════════════════════════════
  # FINAL: Summary & Status
  # ════════════════════════════════════════
  status-summary:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, deploy-backend, deploy-frontend]
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "═══════════════════════════════════════"
          echo "MediConnect-AI CI/CD Pipeline Summary"
          echo "═══════════════════════════════════════"
          echo "Backend Tests: ${{ needs.test-backend.result }}"
          echo "Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "Backend Deploy: ${{ needs.deploy-backend.result }}"
          echo "Frontend Deploy: ${{ needs.deploy-frontend.result }}"
          echo "═══════════════════════════════════════"
          
          if [[ "${{ needs.test-backend.result }}" != "success" || "${{ needs.test-frontend.result }}" != "success" ]]; then
            echo "❌ Tests failed. Check logs above."
            exit 1
          fi
          
          echo "✅ All checks passed!"

      - name: Notify Slack (optional)
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'MediConnect-AI deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
